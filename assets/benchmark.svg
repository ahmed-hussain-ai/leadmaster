<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07070C"/><stop offset="1" stop-color="#101018"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2FB980"/><stop offset="1" stop-color="#2BB5A5"/></linearGradient><linearGradient id="gh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2FB980"/><stop offset="1" stop-color="#2BB5A5"/></linearGradient><radialGradient id="gA" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2FB980" stop-opacity="0.38"/><stop offset="1" stop-color="#2FB980" stop-opacity="0"/></radialGradient><radialGradient id="gB" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2BB5A5" stop-opacity="0.28"/><stop offset="1" stop-color="#2BB5A5" stop-opacity="0"/></radialGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern><clipPath id="clip"><rect width="1200" height="200" rx="24"/></clipPath><linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><style>
  .f { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .pulse { animation: pulse 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .pulse2 { animation: pulse 10s ease-in-out infinite reverse; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%,100% { opacity: .65; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }
  .blink { animation: blink 1.8s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  .scan { animation: scan 6s linear infinite; }
  @keyframes scan { from { transform: translateY(-120px); } to { transform: translateY(620px); } }
  .flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  .caret { animation: blink 1s steps(1) infinite; }
</style></defs><g clip-path="url(#clip)"><rect width="1200" height="200" fill="url(#bg)"/><rect width="1200" height="200" fill="url(#grid)"/><ellipse class="pulse" cx="936.0" cy="60.0" rx="384.0" ry="120.0" fill="url(#gA)"/><ellipse class="pulse2" cx="120.0" cy="200" rx="360.0" ry="90.0" fill="url(#gB)"/><rect class="scan" y="0" width="1200" height="110" fill="url(#scanG)"/><rect width="1200" height="4" fill="url(#gh)"/></g><rect x=".5" y=".5" width="1199" height="199" rx="24" fill="none" stroke="#fff" stroke-opacity=".08"/><text x="60" y="52" class="f" font-size="22" font-weight="800" fill="#F5F5F8">Reply rate vs the usual cold-email range</text><rect x="60" y="96" width="1080" height="22" rx="11" fill="#181822"/><rect x="276.0" y="96" width="432.0" height="22" rx="6" fill="#4A4A60"/><text x="492.0" y="112" text-anchor="middle" class="f" font-size="13" font-weight="700" fill="#F5F5F8">typical 1–3%</text><rect x="60" y="96" width="799.2" height="22" rx="11" fill="url(#gh)" opacity=".35"/><circle class="blink" cx="859.2" cy="107" r="14" fill="#3DD68C" opacity=".35"/><circle cx="859.2" cy="107" r="8" fill="#3DD68C"/><text x="859.2" y="84" text-anchor="middle" class="f" font-size="18" font-weight="800" fill="#3DD68C">LeadMaster 3.7%</text><text x="60.0" y="148" text-anchor="middle" class="m" font-size="13" fill="#6B6B80">0%</text><text x="276.0" y="148" text-anchor="middle" class="m" font-size="13" fill="#6B6B80">1%</text><text x="492.0" y="148" text-anchor="middle" class="m" font-size="13" fill="#6B6B80">2%</text><text x="708.0" y="148" text-anchor="middle" class="m" font-size="13" fill="#6B6B80">3%</text><text x="924.0" y="148" text-anchor="middle" class="m" font-size="13" fill="#6B6B80">4%</text><text x="1140.0" y="148" text-anchor="middle" class="m" font-size="13" fill="#6B6B80">5%</text><text x="60" y="180" class="f" font-size="13.5" fill="#6B6B80">1–3% is the range commonly quoted for B2B cold email.</text></svg>