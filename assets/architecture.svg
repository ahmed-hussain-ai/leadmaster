<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07070C"/><stop offset="1" stop-color="#101018"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2FB980"/><stop offset="1" stop-color="#2BB5A5"/></linearGradient><linearGradient id="gh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2FB980"/><stop offset="1" stop-color="#2BB5A5"/></linearGradient><radialGradient id="gA" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2FB980" stop-opacity="0.38"/><stop offset="1" stop-color="#2FB980" stop-opacity="0"/></radialGradient><radialGradient id="gB" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2BB5A5" stop-opacity="0.28"/><stop offset="1" stop-color="#2BB5A5" stop-opacity="0"/></radialGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern><clipPath id="clip"><rect width="1200" height="720" rx="24"/></clipPath><linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><style>
  .f { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .pulse { animation: pulse 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .pulse2 { animation: pulse 10s ease-in-out infinite reverse; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%,100% { opacity: .65; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }
  .blink { animation: blink 1.8s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  .scan { animation: scan 6s linear infinite; }
  @keyframes scan { from { transform: translateY(-120px); } to { transform: translateY(620px); } }
  .flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  .caret { animation: blink 1s steps(1) infinite; }
</style></defs><g clip-path="url(#clip)"><rect width="1200" height="720" fill="url(#bg)"/><rect width="1200" height="720" fill="url(#grid)"/><ellipse class="pulse" cx="936.0" cy="216.0" rx="384.0" ry="432.0" fill="url(#gA)"/><ellipse class="pulse2" cx="120.0" cy="720" rx="360.0" ry="324.0" fill="url(#gB)"/><rect class="scan" y="0" width="1200" height="110" fill="url(#scanG)"/><rect width="1200" height="4" fill="url(#gh)"/></g><rect x=".5" y=".5" width="1199" height="719" rx="24" fill="none" stroke="#fff" stroke-opacity=".08"/><text x="50" y="52" class="f" font-size="15" font-weight="700" letter-spacing="3" fill="#2FB980">LEADMASTER · FROM A LEAD LIST TO A REPLY</text>
<text x="50" y="90" class="f" font-size="32" font-weight="800" fill="#F5F5F8">AI cold-outreach engine</text>
<g transform="translate(839 48)"><rect width="311" height="40" rx="20" fill="#3DD68C" fill-opacity=".12" stroke="#3DD68C" stroke-opacity=".55"/>
<circle class="blink" cx="22" cy="20" r="6" fill="#3DD68C"/><text x="38" y="26" class="f" font-size="16" font-weight="700" fill="#F5F5F8">3.7% reply rate · 8,778 sent</text></g><rect x="50" y="128" width="330" height="124" rx="16" fill="#181822" stroke="#3DD68C" stroke-opacity=".5" stroke-width="1.5"/>
<rect x="72" y="146" width="32" height="4" rx="2" fill="#3DD68C"/>
<text x="72" y="180" class="f" font-size="22" font-weight="700" fill="#F5F5F8">Lead lists</text>
<text x="72" y="209" class="f" font-size="17" fill="#A3A3B5">CSV upload, or Apify</text>
<text x="72" y="232" class="f" font-size="17" fill="#A3A3B5">and Apollo sourcing</text><rect x="435" y="128" width="330" height="124" rx="16" fill="#181822" stroke="#3DD68C" stroke-opacity=".5" stroke-width="1.5"/>
<rect x="457" y="146" width="32" height="4" rx="2" fill="#3DD68C"/>
<text x="457" y="180" class="f" font-size="22" font-weight="700" fill="#F5F5F8">Categories</text>
<text x="457" y="209" class="f" font-size="17" fill="#A3A3B5">Leads segmented by</text>
<text x="457" y="232" class="f" font-size="17" fill="#A3A3B5">industry and region</text><rect x="820" y="128" width="330" height="124" rx="16" fill="#181822" stroke="#3DD68C" stroke-opacity=".5" stroke-width="1.5"/>
<rect x="842" y="146" width="32" height="4" rx="2" fill="#3DD68C"/>
<text x="842" y="180" class="f" font-size="22" font-weight="700" fill="#F5F5F8">Research</text>
<text x="842" y="209" class="f" font-size="17" fill="#A3A3B5">n8n reads each lead's</text>
<text x="842" y="232" class="f" font-size="17" fill="#A3A3B5">LinkedIn and website</text><rect x="820" y="300" width="330" height="124" rx="16" fill="#181822" stroke="#3BA4F0" stroke-opacity=".5" stroke-width="1.5"/>
<rect x="842" y="318" width="32" height="4" rx="2" fill="#3BA4F0"/>
<text x="842" y="352" class="f" font-size="22" font-weight="700" fill="#F5F5F8">AI writer</text>
<text x="842" y="381" class="f" font-size="17" fill="#A3A3B5">Claude or GPT-4o writes a</text>
<text x="842" y="404" class="f" font-size="17" fill="#A3A3B5">personal first email</text><rect x="435" y="300" width="330" height="124" rx="16" fill="#181822" stroke="#3BA4F0" stroke-opacity=".5" stroke-width="1.5"/>
<rect x="457" y="318" width="32" height="4" rx="2" fill="#3BA4F0"/>
<text x="457" y="352" class="f" font-size="22" font-weight="700" fill="#F5F5F8">Campaigns</text>
<text x="457" y="381" class="f" font-size="17" fill="#A3A3B5">Sending spread across</text>
<text x="457" y="404" class="f" font-size="17" fill="#A3A3B5">several Gmail inboxes</text><rect x="50" y="300" width="330" height="124" rx="16" fill="#181822" stroke="#3BA4F0" stroke-opacity=".5" stroke-width="1.5"/>
<rect x="72" y="318" width="32" height="4" rx="2" fill="#3BA4F0"/>
<text x="72" y="352" class="f" font-size="22" font-weight="700" fill="#F5F5F8">Follow-ups</text>
<text x="72" y="381" class="f" font-size="17" fill="#A3A3B5">3 follow-ups per lead,</text>
<text x="72" y="404" class="f" font-size="17" fill="#A3A3B5">in the same thread</text><rect x="50" y="472" width="330" height="124" rx="16" fill="#181822" stroke="#F5A044" stroke-opacity=".5" stroke-width="1.5"/>
<rect x="72" y="490" width="32" height="4" rx="2" fill="#F5A044"/>
<text x="72" y="524" class="f" font-size="22" font-weight="700" fill="#F5F5F8">Reply detection</text>
<text x="72" y="553" class="f" font-size="17" fill="#A3A3B5">Every inbox scanned; reply</text>
<text x="72" y="576" class="f" font-size="17" fill="#A3A3B5">matched by thread ID</text><rect x="435" y="472" width="330" height="124" rx="16" fill="#181822" stroke="#F5A044" stroke-opacity=".5" stroke-width="1.5"/>
<rect x="457" y="490" width="32" height="4" rx="2" fill="#F5A044"/>
<text x="457" y="524" class="f" font-size="22" font-weight="700" fill="#F5F5F8">Sequence stop</text>
<text x="457" y="553" class="f" font-size="17" fill="#A3A3B5">A lead who replies gets</text>
<text x="457" y="576" class="f" font-size="17" fill="#A3A3B5">no more follow-ups</text><rect x="820" y="472" width="330" height="124" rx="16" fill="#181822" stroke="#F5A044" stroke-opacity=".5" stroke-width="1.5"/>
<rect x="842" y="490" width="32" height="4" rx="2" fill="#F5A044"/>
<text x="842" y="524" class="f" font-size="22" font-weight="700" fill="#F5F5F8">Dashboard</text>
<text x="842" y="553" class="f" font-size="17" fill="#A3A3B5">Sends, replies and bounces</text>
<text x="842" y="576" class="f" font-size="17" fill="#A3A3B5">per campaign, per day</text><line class="flow" x1="380" y1="190.0" x2="435" y2="190.0" stroke="#3DD68C" stroke-width="3"/><path d="M435 190.0l-10 -6v12z" fill="#3DD68C"/><line class="flow" x1="765" y1="190.0" x2="820" y2="190.0" stroke="#3DD68C" stroke-width="3"/><path d="M820 190.0l-10 -6v12z" fill="#3DD68C"/><line class="flow" x1="985.0" y1="252" x2="985.0" y2="300" stroke="#3BA4F0" stroke-width="3"/><path d="M985.0 300l-6 -10h12z" fill="#3BA4F0"/><line class="flow" x1="820" y1="362.0" x2="765" y2="362.0" stroke="#3BA4F0" stroke-width="3"/><path d="M765 362.0l10 -6v12z" fill="#3BA4F0"/><line class="flow" x1="435" y1="362.0" x2="380" y2="362.0" stroke="#3BA4F0" stroke-width="3"/><path d="M380 362.0l10 -6v12z" fill="#3BA4F0"/><line class="flow" x1="215.0" y1="424" x2="215.0" y2="472" stroke="#F5A044" stroke-width="3"/><path d="M215.0 472l-6 -10h12z" fill="#F5A044"/><line class="flow" x1="380" y1="534.0" x2="435" y2="534.0" stroke="#F5A044" stroke-width="3"/><path d="M435 534.0l-10 -6v12z" fill="#F5A044"/><line class="flow" x1="765" y1="534.0" x2="820" y2="534.0" stroke="#F5A044" stroke-width="3"/><path d="M820 534.0l-10 -6v12z" fill="#F5A044"/><text x="50" y="640" class="f" font-size="14" font-weight="700" letter-spacing="2.5" fill="#6B6B80">UNDER THE HOOD</text><rect x="50" y="658" width="93" height="32" rx="16.0" fill="#3BA4F0" fill-opacity=".13" stroke="#3BA4F0" stroke-opacity=".5"/><text x="96.5" y="679.4" text-anchor="middle" class="f" font-size="15" font-weight="600" fill="#3BA4F0">FastAPI</text><rect x="153" y="658" width="165" height="32" rx="16.0" fill="#9B8CFF" fill-opacity=".13" stroke="#9B8CFF" stroke-opacity=".5"/><text x="235.5" y="679.4" text-anchor="middle" class="f" font-size="15" font-weight="600" fill="#9B8CFF">React + AG Grid</text><rect x="328" y="658" width="120" height="32" rx="16.0" fill="#3BA4F0" fill-opacity=".13" stroke="#3BA4F0" stroke-opacity=".5"/><text x="388.0" y="679.4" text-anchor="middle" class="f" font-size="15" font-weight="600" fill="#3BA4F0">PostgreSQL</text><rect x="458" y="658" width="111" height="32" rx="16.0" fill="#F5A044" fill-opacity=".13" stroke="#F5A044" stroke-opacity=".5"/><text x="513.5" y="679.4" text-anchor="middle" class="f" font-size="15" font-weight="600" fill="#F5A044">Gmail API</text><rect x="579" y="658" width="57" height="32" rx="16.0" fill="#D06CC0" fill-opacity=".13" stroke="#D06CC0" stroke-opacity=".5"/><text x="607.5" y="679.4" text-anchor="middle" class="f" font-size="15" font-weight="600" fill="#D06CC0">n8n</text><rect x="646" y="658" width="192" height="32" rx="16.0" fill="#3DD68C" fill-opacity=".13" stroke="#3DD68C" stroke-opacity=".5"/><text x="742.0" y="679.4" text-anchor="middle" class="f" font-size="15" font-weight="600" fill="#3DD68C">Background workers</text><rect x="848" y="658" width="165" height="32" rx="16.0" fill="#9B8CFF" fill-opacity=".13" stroke="#9B8CFF" stroke-opacity=".5"/><text x="930.5" y="679.4" text-anchor="middle" class="f" font-size="15" font-weight="600" fill="#9B8CFF">OpenAI + Claude</text></svg>