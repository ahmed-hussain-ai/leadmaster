<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="718" viewBox="0 0 1200 718">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2FB980"/><stop offset="1" stop-color="#2BB5A5"/></linearGradient><radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2FB980" stop-opacity="0.2"/><stop offset="1" stop-color="#2FB980" stop-opacity="0"/></radialGradient><clipPath id="c"><rect width="1200" height="718" rx="24"/></clipPath><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern><style>
  .f { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
  .pulse { animation: pulse 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .pulse2 { animation: pulse 9s ease-in-out infinite reverse; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%,100% { opacity: .7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
  .spin { animation: spin 36s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .live { animation: blink 2s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
</style><style>
  .flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -28; } }
</style></defs>
<g clip-path="url(#c)">
  <rect width="1200" height="718" fill="#101018"/><rect width="1200" height="718" fill="url(#grid)"/>
  <ellipse class="pulse" cx="600" cy="359.0" rx="560" ry="359.0" fill="url(#gl)"/>
  <rect width="1200" height="4" fill="url(#g)"/>
</g>
<rect x=".5" y=".5" width="1199" height="717" rx="24" fill="none" stroke="#fff" stroke-opacity=".08"/>
<text x="50" y="52" class="f" font-size="15" font-weight="700" letter-spacing="3" fill="#2FB980">LEADMASTER · FROM A LEAD LIST TO A REPLY</text>
<text x="50" y="90" class="f" font-size="32" font-weight="800" fill="#F5F5F8">AI cold-outreach engine</text>
<g transform="translate(839 48)">
  <rect width="311" height="40" rx="20" fill="#3DD68C" fill-opacity=".12" stroke="#3DD68C" stroke-opacity=".55"/>
  <circle class="live" cx="22" cy="20" r="6" fill="#3DD68C"/>
  <text x="38" y="26" class="f" font-size="16" font-weight="700" fill="#F5F5F8">3.7% reply rate · 8,778 sent</text>
</g>
<g class="rise">
  <rect x="50" y="128" width="330" height="124" rx="16" fill="#181822" stroke="#3DD68C" stroke-opacity=".5" stroke-width="1.5"/>
  <rect x="72" y="146" width="32" height="4" rx="2" fill="#3DD68C"/>
  <text x="72" y="180" class="f" font-size="22" font-weight="700" fill="#F5F5F8">Lead lists</text>
  <text x="72" y="209" class="f" font-size="17" fill="#A3A3B5">CSV upload, or Apify</text>
  <text x="72" y="232" class="f" font-size="17" fill="#A3A3B5">and Apollo sourcing</text>
</g><g class="rise">
  <rect x="435" y="128" width="330" height="124" rx="16" fill="#181822" stroke="#3DD68C" stroke-opacity=".5" stroke-width="1.5"/>
  <rect x="457" y="146" width="32" height="4" rx="2" fill="#3DD68C"/>
  <text x="457" y="180" class="f" font-size="22" font-weight="700" fill="#F5F5F8">Categories</text>
  <text x="457" y="209" class="f" font-size="17" fill="#A3A3B5">Leads segmented by</text>
  <text x="457" y="232" class="f" font-size="17" fill="#A3A3B5">industry and region</text>
</g><g class="rise">
  <rect x="820" y="128" width="330" height="124" rx="16" fill="#181822" stroke="#3DD68C" stroke-opacity=".5" stroke-width="1.5"/>
  <rect x="842" y="146" width="32" height="4" rx="2" fill="#3DD68C"/>
