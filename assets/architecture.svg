  <text x="72" y="553" class="f" font-size="17" fill="#A3A3B5">Every inbox scanned; reply</text>
  <text x="72" y="576" class="f" font-size="17" fill="#A3A3B5">matched by thread ID</text>
</g><g class="rise">
  <rect x="435" y="472" width="330" height="124" rx="16" fill="#181822" stroke="#F5A044" stroke-opacity=".5" stroke-width="1.5"/>
  <rect x="457" y="490" width="32" height="4" rx="2" fill="#F5A044"/>
  <text x="457" y="524" class="f" font-size="22" font-weight="700" fill="#F5F5F8">Sequence stop</text>
  <text x="457" y="553" class="f" font-size="17" fill="#A3A3B5">A lead who replies gets</text>
  <text x="457" y="576" class="f" font-size="17" fill="#A3A3B5">no more follow-ups</text>
</g><g class="rise">
  <rect x="820" y="472" width="330" height="124" rx="16" fill="#181822" stroke="#F5A044" stroke-opacity=".5" stroke-width="1.5"/>
  <rect x="842" y="490" width="32" height="4" rx="2" fill="#F5A044"/>
  <text x="842" y="524" class="f" font-size="22" font-weight="700" fill="#F5F5F8">Dashboard</text>
  <text x="842" y="553" class="f" font-size="17" fill="#A3A3B5">Sends, replies and bounces</text>
  <text x="842" y="576" class="f" font-size="17" fill="#A3A3B5">per campaign, per day</text>
</g><line class="flow" x1="380" y1="190.0" x2="435" y2="190.0" stroke="#3DD68C" stroke-width="3"/><path d="M435 190.0l-10 -6v12z" fill="#3DD68C"/><line class="flow" x1="765" y1="190.0" x2="820" y2="190.0" stroke="#3DD68C" stroke-width="3"/><path d="M820 190.0l-10 -6v12z" fill="#3DD68C"/><line class="flow" x1="985.0" y1="252" x2="985.0" y2="300" stroke="#3BA4F0" stroke-width="3"/><path d="M985.0 300l-6 -10h12z" fill="#3BA4F0"/><line class="flow" x1="820" y1="362.0" x2="765" y2="362.0" stroke="#3BA4F0" stroke-width="3"/><path d="M765 362.0l10 -6v12z" fill="#3BA4F0"/><line class="flow" x1="435" y1="362.0" x2="380" y2="362.0" stroke="#3BA4F0" stroke-width="3"/><path d="M380 362.0l10 -6v12z" fill="#3BA4F0"/><line class="flow" x1="215.0" y1="424" x2="215.0" y2="472" stroke="#F5A044" stroke-width="3"/><path d="M215.0 472l-6 -10h12z" fill="#F5A044"/><line class="flow" x1="380" y1="534.0" x2="435" y2="534.0" stroke="#F5A044" stroke-width="3"/><path d="M435 534.0l-10 -6v12z" fill="#F5A044"/><line class="flow" x1="765" y1="534.0" x2="820" y2="534.0" stroke="#F5A044" stroke-width="3"/><path d="M820 534.0l-10 -6v12z" fill="#F5A044"/>
